<style>

:root[data-theme="dark"]{--bg:#17181b;--sf:#222428;--tx:#ececec;--mu:#9a9ea6;--bd:#3a3d44;--c0:#9b8cf5;--c1:#5db6ea;--c2:#5fd3a0;--c3:#e9b24f;--c4:#f0707f;--ln:#555964}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.8}
header{padding:20px 24px 4px}h1{margin:0;font-size:22px;font-weight:800}
header p{margin:4px 0 0;color:var(--mu);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 24px;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}
.scroll{overflow-x:auto;padding:8px 16px 40px}
#map{position:relative;min-width:1180px;display:grid;grid-template-columns:repeat(5,1fr);gap:0 56px;padding:8px 8px}
.col{display:flex;flex-direction:column;gap:12px;justify-content:space-around;position:relative;z-index:2}
.col h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--mu);text-align:center;border-bottom:2px solid var(--bd);padding-bottom:6px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg path{fill:none;stroke:var(--ln);stroke-width:1.4;opacity:.45;transition:.2s}
svg path.p{stroke:var(--c4);stroke-dasharray:5 4;opacity:0}
svg path.on{stroke-width:2.6;opacity:1;stroke:var(--ac)}
svg path.p.on{stroke:var(--c4)}
.n{background:var(--sf);border:1.5px solid var(--bd);border-right:5px solid var(--ac);border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--tx);text-align:right;cursor:pointer;transition:.2s}
.n:hover,.n:focus-visible{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.15);outline:none}
.n small{display:block;color:var(--mu);font-size:11.5px}
.n.dim{opacity:.28}.n.sel{background:var(--ac);color:#fff}.n.sel small{color:#fff;opacity:.85}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.show{display:flex}
#pop{background:var(--sf);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px 24px;border-top:6px solid var(--ac);box-shadow:0 20px 60px rgba(0,0,0,.4)}
#pop h2{margin:0 0 2px;font-size:19px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:20px;background:var(--ac);color:#fff;margin-bottom:8px}

.tk{direction:ltr;text-align:left;font-size:12px;color:var(--mu);word-break:break-all}
.sol{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:4px 0}
#x{float:left;border:0;background:var(--bg);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}

<p>روی هر کارت کلیک کنید تا مسیر آن روشن شود و توضیح کامل باز شود. مشکل‌ها با خط‌چین قرمز به گره‌های درگیر وصل می‌شوند.</p></header>

<script>

root:[0,'دامنه اصلی (@)','Root / Apex','قاعده کلی: هر دامنه فقط یک مدیر DNS دارد. روی CDN می‌توان CNAME یا A گذاشت (با حذف رکورد A متداخل)، اما روی DNS خارجی بدون CNAME Flattening فقط رکورد A ممکن است.'],

host:[1,'هاست ابری','Cloud Host','کاربر یا چهار نیم‌سرور پلتفرم را برای واگذاری DNS تنظیم می‌کند، یا DNS بیرونی خود را نگه می‌دارد و @ را با رکورد A به IP هاست متصل می‌کند. برای زیردامنه‌ها CNAME اختصاصی وجود دارد (به دلیل احتمال تغییر IP). برای استفاده از CNAME باید ابتدا رکورد A حذف شود. در پنل، تفاوت روش نیم‌سرور با روش رکورد DNS در نگاه اول مشخص نیست.'],

obj:[1,'فضای ابری','Object Storage','چهار رکورد NS برای زیردامنه در Zone دامنه تعریف می‌شود؛ بدون نیاز به تغییر IP و بدون تغییر نیم‌سرورهای کل دامنه. جایگزین: CNAME به نام پیش‌فرض باکت در CDN (با حذف رکورد A قبلی)، اما NS به دلیل پایداری ترجیح دارد.'],

m_s4:[2,'واگذاری زیردامنه (۴ NS)','Sub-delegation (Object Storage)','چهار رکورد NS اختصاصی برای زیردامنه در Zone دامنه، بدون نیاز به تغییر IP و بدون تغییر نیم‌سرور کل دامنه.'],
m_cb:[2,'CNAME به باکت پیش‌فرض','Bucket CNAME','جایگزین NS برای فضای ابری. نیازمند حذف رکورد A قبلی است و به دلیل پایداری کمتر، NS ترجیح داده می‌شود.'],
m_ce:[2,'CNAME به Endpoint اپ','App Endpoint CNAME','CNAME مستقیم به Endpoint پویای برنامه، روی ریشه (با شرط حذف رکورد A پیش‌فرض در پنل CDN یا هاست ابری) یا روی زیردامنه (بدون تداخل).'],

z_host:[3,'پنل هاست ابری','Editor #1','تا وقتی نیم‌سرورهای هاست ابری فعال است، کاربر در این پنل رکوردها را می‌بیند و ویرایش می‌کند.'],
z_cdn:[3,'پنل CDN','Editor #2','تا وقتی نیم‌سرورهای CDN فعال است، ویرایشگر رسمی Zone است. پیامد: برخی کاربران CDN را فقط به‌عنوان DNS Manager می‌خرند.'],
z_hid:[3,'Zone پنهان و مدیریت‌شده','Hidden Zone','هاست دانلود و ذخیره‌سازی آبجکت رکوردها را در Zone پنهان می‌سازند و ویرایشگر ندارند؛ بنابراین نیم‌سرور فقط برای زیردامنه باید ساخته شود، نه دامنه اصلی.'],
z_ext:[3,'DNS بیرونی','External DNS','اگر دامنه روی DNS خارجی باشد، رکوردها همان‌جا مدیریت می‌شود. بدون CNAME Flattening روی ریشه فقط A ممکن است.'],
p1:[4,'نبود DNS Editor یکپارچه','مشکل ۱','ویرایشگر رکورد فقط در پنل CDN و هاست ابری وجود دارد. اگر کاربر فقط هاست دانلود، استوریج یا اپ بخرد، جایی برای مدیریت رکورد ندارد و باید CDN بخرد. بخش دامنه هم مدیریت رکورد ندارد. پیامد جدی: قفل شدن رکوردهای Apex (MX، TXT و ...) در هاست دانلود و استوریج.','76319630, 61159589, 90516073, 15476621, 77254410, 22393611, 89521882, 66199210, 63093865, 87816874, 15523314, 54360825, 37803451, 59727272, 79804671, 41373939, 57870266, 11807331, 52503537, 56511608','ارائه ویرایشگر DNS یکپارچه یا مسیر شفاف‌تر برای مدیریت رکوردها.'],
p2:[4,'خطای تداخل رکورد A و CNAME','مشکل ۲','روی ریشه به‌طور پیش‌فرض رکورد A وجود دارد و پنل خطای تداخل را با پیام عمومی نشان می‌دهد («رکورد با این مقدار وجود دارد» در CDN، «رکورد نامعتبر است» در هاست). کاربر نمی‌فهمد علت، رکورد A است. در خرید CDN هم CNAME روی روت مجاز است ولی با A اجباریِ غیرقابل‌حذف نمی‌توان به مرحله بعد رفت.','82136742, 45310245','پاپ‌آپ تاییدیه: «ثبت CNAME نیازمند حذف رکورد A فعلی است؛ آیا سیستم خودکار انجام دهد؟» یا حداقل ارور شفاف‌تر.'],
p3:[4,'اجبار رکورد A در آنبوردینگ CDN','مشکل ۳','کاربرانی که CDN را فقط برای DNS Manager رایگان می‌خرند، مجبور به ثبت IP و رکورد A ساختگی‌اند و سپس برای PaaS یا ایمیل باید آن را دستی حذف کنند. حالت DNS only قابل‌ردشدن نیست.','66294567, 70375759, 21570375','امکان Skip یا حذف رکوردهای اجباری قبل از خرید؛ راهنمایی برای وارد کردن IP origin؛ اجباری نبودن برای استفاده صرفاً DNS.'],
p4:[4,'راهنمایی ناکافی در فرم‌ها','مشکل ۴','فرم‌ها ریشه و زیردامنه را تشخیص نمی‌دهند، مقادیر (Endpoint، نیم‌سرور) را نشان نمی‌دهند، تفاوت روش نیم‌سرور و رکورد در هاست مشخص نیست و کاربران ساخت NS زیردامنه را با تغییر نیم‌سرور اصلی اشتباه می‌گیرند. در یک نمونه، افزودن و حذف دامنه اصلی در استوریج رکورد ریشه را پاک و سایت را از دسترس خارج کرد.','(تیکت‌های هاست) 33234519, 64719335, 88507115, 74028226, 13158055, 66890512, 32075051, 28799814, 65284644, 11978485, 82140623, 57161571, 65536509, 12614776','فرم پویا با تشخیص خودکار ریشه/زیردامنه و نمایش فقط گزینه‌های معتبر؛ نمایش مقادیر با دکمه Copy (In-line Helper)؛ اعلام اینکه با داشتن DNS Provider در هاست نیازی به تغییر نیم‌سرور نیست.'],
p5:[4,'شکست احراز TXT در استوریج','مشکل ۵','برای اثبات مالکیت دامنه به رکورد TXT نیاز است. اگر کاربر پیش از تکمیل تاییدیه، نیم‌سرورهای کل دامنه را تغییر دهد، نیم‌سرورهای استوریج به TXT پاسخ نمی‌دهند و DNS قبلی هم از دسترس خارج است؛ احراز هویت قفل و کاربر در بن‌بست می‌ماند (ادج‌کیس فوق‌بحرانی).','','هشدار صریح پیش از تغییر نیم‌سرور و ترجیح روش NS زیردامنه.'],

};

p6:[4,'مشخص نبودن روش غیر از نیم‌سرور','مشکل ۶','در پنل، روشی غیر از نیم‌سرور (ثبت رکورد A یا CNAME) برای اتصال مشخص نشده است. در هاست، تفاوت روش نیم‌سرور و استفاده از رکوردهای DNS در نگاه اول معلوم نیست. در هاست دانلود و فضای ابری هم مستندات فقط NS را می‌گوید و پنل افزودن دامنه اصلی را بدون توضیح تفاوت‌ها نشان می‌دهد؛ بعضی کاربران هم اصلاً تمایلی به روش نیم‌سرور ندارند ولی راه دیگری نمی‌بینند.','','در فرم، برای سرویس‌هایی مثل هاست نشان داده شود که اگر کاربر DNS Provider دارد، نیازی به تغییر نیم‌سرور نیست و می‌تواند با ساخت رکورد وصل کند.'],

});

function draw(){svg.innerHTML='';paths.length=0;const m=map.getBoundingClientRect();
[...E.map(e=>[...e,0]),...P.map(e=>[...e,1])].forEach(([a,b,p])=>{const A=el[a].getBoundingClientRect(),B=el[b].getBoundingClientRect();
const left=A.left+A.width/2>B.left+B.width/2;const x1=(left?A.left:A.right)-m.left,x2=(left?B.right:B.left)-m.left,y1=A.top+A.height/2-m.top,y2=B.top+B.height/2-m.top,d=(x2-x1)/2;
const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',`M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`);
q.style.setProperty('--ac',getComputedStyle(el[b].parentNode).getPropertyValue('--ac'));if(p)q.classList.add('p');svg.appendChild(q);paths.push({q,a,b,p})})}
let cur=null;
function link(id){const s=new Set([id]);const adj=p=>{const r=[];E.forEach(([a,b])=>{r.push([a,b])});return r};
const up=[id],dn=[id];while(up.length){const x=up.pop();E.forEach(([a,b])=>{if(b===x&&!s.has(a)){s.add(a);up.push(a)}})}
while(dn.length){const x=dn.pop();E.forEach(([a,b])=>{if(a===x&&!s.has(b)){s.add(b);dn.push(b)}})}
if(id[0]==='p')P.forEach(([a,b])=>{if(a===id)s.add(b)});else P.forEach(([a,b])=>{if(b===id)s.add(a)});return s}
function pick(id){cur=id;const s=link(id);
for(const k in el){el[k].classList.toggle('dim',!s.has(k));el[k].classList.toggle('sel',k===id)}
paths.forEach(({q,a,b,p})=>q.classList.toggle('on',s.has(a)&&s.has(b)&&(p?(a===id||b===id):true)));
const [n,t,s2,d,tk,sol]=N[id];document.getElementById('pop').style.setProperty('--ac','var('+acc[n]+')');
let h='<span class="tag">'+H[n]+'</span><h2>'+t+'</h2><p>'+d+'</p>';
if(sol)h+='<h4>راهکار پیشنهادی</h4><div class="sol">'+sol+'</div>';
if(tk)h+='<h4>نمونه تیکت‌ها</h4><div class="tk">'+tk+'</div>';
const rel=[...s].filter(k=>k!==id);if(rel.length)h+='<h4>گره‌های مرتبط</h4><div class="chips">'+rel.map(k=>'<button class="chip" onclick="pick(\''+k+'\')">'+N[k][1]+'</button>').join('')+'</div>';
document.getElementById('pc').innerHTML=h;document.getElementById('ov').classList.add('show')}
function close_(){document.getElementById('ov').classList.remove('show')}
document.getElementById('x').onclick=close_;
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close_()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
map.addEventListener('dblclick',()=>{});
document.querySelector('.scroll').addEventListener('click',e=>{if(e.target===map||e.target.classList.contains('col')){for(const k in el)el[k].classList.remove('dim','sel');paths.forEach(x=>x.q.classList.remove('on'))}});
document.fonts&&document.fonts.ready.then(draw);addEventListener('resize',draw);draw();
</script>
</body>
</html>
